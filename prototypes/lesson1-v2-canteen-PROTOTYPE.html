  #left { position:fixed; top:12px; left:12px; width:min(360px,42vw); display:flex; flex-direction:column; gap:10px; }

<!-- ============================ DATA ============================ -->
<script id="data">
// ---- Three tools, big and simple. Emoji do the explaining. ----
const TOOLS = {
  metrics: { label:'Check numbers',  icon:'👀', sub:'How is it doing?',        cost:1 },
  logs:    { label:'Read the diary', icon:'📖', sub:'What has it been doing?', cost:1 },
  changes: { label:'What changed?',  icon:'❓', sub:'Did anything change lately?', cost:1 },
};
const ROLE_LABEL = { cause:'the real cause', symptom:'where the effect shows up', decoy:'a loud decoy', innocent:'an innocent bystander' };

// ---- Words you pick up. Short, with a picture in your head. ----
const CODEX = {
  cache:      { term:'Cache',          pic:'🧊', def:'A fast spot that keeps popular answers handy, like the fridge by the counter. It saves a long walk.' },
  logs:       { term:'Logs',           pic:'📖', def:'The diary a program keeps about what it did. Engineers read it to find out what happened.' },
  symptom:    { term:'Symptom vs. cause', pic:'🔥', def:'The busy storeroom is a symptom, the thing you can see. The cause is what made it busy. Fix the cause.' },
  deploy:     { term:'Update (deploy)', pic:'🚀', def:'Putting new code live. Lots of problems start right after one, so always ask "what changed?"' },
  hypothesis: { term:'Hypothesis',     pic:'💡', def:'A guess you state before you act, so you can check if you were right.' },
  rollback:   { term:'Rollback',       pic:'⏪', def:'Undoing an update by going back to the old version. Often the fastest safe fix.' },
};
const CODEX_ON = { 'cache:metrics':['cache'], 'cache:logs':['logs','symptom'], 'app:changes':['deploy'] };

const THEMES = {
  canteen: {
    id:'canteen', title:'Lesson 1 · The Empty Fridge',
    place:'school canteen',
    symptom:'Students are waiting forever for their food, then giving up.',
    app:'Counter', cache:'Fridge', db:'Storeroom',
    appNoun:'counter', cacheNoun:'fridge', dbNoun:'storeroom', thing:'order', item:'snack',
    sub:{ app:'takes the orders', cache:'popular snacks, super quick', db:'has everything, but far away' },
    blurb:{ app:'Students order here.', cache:'Keeps the popular snacks close.', db:'Holds everything, but it\'s a long walk.' },
    rel:12, ago:40, relName:'New name-tag maker',
    keys:['sandwich-12:03', 'sandwich-12:04', 'juice-12:04'],
    rollbackLabel:'Undo update #12 (rollback)',
    customers:[
      { name:'Maya',  story:'Her lunch break ran out.' },
      { name:'Joe',   story:'He had football practice.' },
      { name:'Priya', story:'She had a test next period.' },
      { name:'Sam',   story:'He skipped breakfast.' },
      { name:'Leo',   story:'He was starving.' },
    ],
  },
  ticket_rush: {
    id:'ticket_rush', title:'Lesson 1b · The Ticket Rush (new disguise)',
    place:'ticket site',
    symptom:'Fans buying concert tickets get a spinning wheel, then an error.',
    app:'Box Office', cache:'Seat Board', db:'Archive',
    appNoun:'box office', cacheNoun:'seat board', dbNoun:'archive', thing:'ticket request', item:'seat',
    sub:{ app:'takes the requests', cache:'recent seats, super quick', db:'every seat ever, far away' },
    blurb:{ app:'Ticket requests arrive here.', cache:'Lists seats that were just checked.', db:'Every seat ever sold. Big and slow.' },
    rel:31, ago:27, relName:'New seat-code maker',
    keys:['seat-A12:09', 'seat-A13:09', 'seat-C07:10'],
    rollbackLabel:'Undo update #31 (rollback)',
    customers:[
      { name:'Nia',  story:'It was a surprise for her mum.' },
      { name:'Omar', story:'He had saved for months.' },
      { name:'Zoe',  story:'Her friends were waiting on her.' },
      { name:'Kai',  story:'He was buying for his class.' },
      { name:'Rosa', story:'It was her favourite band.' },
    ],
  },
};

function makeScenario(t) {
  const tag = t.id === 'canteen' ? 'name tags' : 'seat codes';
  return {
    id:t.id, title:t.title, symptom:t.symptom, theme:t,
    focus:99, startImpact:5, baseImpact:4,
    components:{
      app:{ name:t.app, role:'cause', calls:['cache', 'db'], clues:{
        metrics:`Each ${t.thing} takes 14 seconds. It should take 1.`,
        logs:`"${t.cache}: nothing. ${t.db}: waited 13 seconds." Again and again.`,
        changes:`Update #${t.rel}, ${t.ago + 1} minutes ago: "${t.relName}". The slowdown began ${t.ago} minutes ago.` } },
      cache:{ name:t.cache, role:'symptom', calls:[], clues:{
        metrics:`The ${t.cacheNoun} works fine, but it found 0 ${t.item}s out of 100. Normally 94.`,
        logs:`Orders ask for ${tag} like "${t.keys[0]}" and "${t.keys[1]}". The ${t.cacheNoun} has never seen them.`,
        changes:`Nobody touched the ${t.cacheNoun} in 30 days.` } },
      db:{ name:t.db, role:'decoy', calls:[], clues:{
        metrics:`The ${t.dbNoun} is 98% busy. Look at that line!`,
        logs:`Just ordinary requests, but 40 times more than usual.`,
        changes:`No changes for 3 weeks.` } },
    },
    mitigations:[],
    fixes:[
      { id:'f_rollback', target:'app', label:t.rollbackLabel, cost:1, kind:'root',
        outcome:`The old ${tag} are back. The ${t.cacheNoun} finds ${t.item}s again and the line melts away.` },
      { id:'f_staff', target:'app', label:`Hire more ${t.appNoun} staff`, cost:1, kind:'wrong', penalty:12,
        outcome:`More staff, same problem. They all still walk to the empty ${t.cacheNoun} and the busy ${t.dbNoun}.` },
      { id:'f_restock', target:'cache', label:`Refill the ${t.cacheNoun}`, cost:1, kind:'wrong', penalty:12,
        outcome:`The refilled items have the old ${tag}. New orders use new ${tag}, so still nothing matches.` },
      { id:'f_clerks', target:'db', label:`Add more ${t.dbNoun} helpers`, cost:1, kind:'partial',
        outcome:`The line moves faster, but the ${t.dbNoun} still does 40 times the work. Time bought, cause not fixed.` },
    ],
    rootSummary:`Update #${t.rel} changed how the ${t.appNoun} writes ${tag}, so the ${t.cacheNoun} never recognised an ${t.thing}. Everything went to the ${t.dbNoun}, a huge line formed, and people gave up.`,
    lessons:[
      `The busy ${t.dbNoun} was a symptom. The cause was further back.`,
      `"What changed?" found the culprit fast.`,
      `Fix the cause (undo the update), not just the symptom.`,
    ],
    intro:[
      { focus:'app',   broken:false, hit:.7,  text:`Welcome to the ${t.place}. The ${t.appNoun} takes the ${t.thing}s.` },
      { focus:'cache', broken:false, hit:.7,  text:`The ${t.cacheNoun} keeps the most popular ${t.item}s. It's quick: ✓` },
      { focus:'db',    broken:false, hit:.7,  text:`If the ${t.cacheNoun} doesn't have it, someone walks to the ${t.dbNoun}. Slow! Only now and then.` },
      { focus:'gate',  broken:false, hit:.94, text:`On a normal day the ${t.cacheNoun} answers almost everything. No line, happy customers.` },
      { focus:'db',    broken:true,  hit:0,   text:`But today something broke. Look at the ${t.dbNoun}: a line is growing, and people are getting upset.` },
    ],
    replay:[
      { focus:'app',   broken:false, title:'1 · An update goes live',    text:`Update #${t.rel} ships: "${t.relName}". Nothing looks wrong yet.` },
      { focus:'cache', broken:true,  title:'2 · The labels stop matching', text:`The ${t.cacheNoun} only knows the old ${tag}. Every lookup misses.` },
      { focus:'db',    broken:true,  title:'3 · Everyone goes to the ' + t.dbNoun, text:`With the ${t.cacheNoun} useless, every ${t.thing} makes the long walk. 40 times the work.` },
      { focus:'db',    broken:true,  title:'4 · The line grows',         text:`The ${t.dbNoun} can only serve one at a time. Everyone waits longer.` },
      { focus:'gate',  broken:true,  title:'5 · People give up',         text:`The ${t.dbNoun} looked guilty, but the cause was the update, right at the start.`, leave:true },
    ],
    teach:{
      q:`Why did the line get so long?`,
      options:[
        { t:`The ${t.dbNoun} broke.`, ok:false, why:`It was busy, not broken. Busy was the symptom. Ask what made it busy.` },
        { t:`An update changed the ${tag}, so the ${t.cacheNoun} stopped helping.`, ok:true, why:`Yes! Update → ${t.cacheNoun} misses → everyone goes to the ${t.dbNoun} → line grows.` },
        { t:`More customers showed up.`, ok:false, why:`The crowd was normal. The work per customer exploded.` },
      ],
    },
  };
}
const SCENARIOS = Object.fromEntries(Object.entries(THEMES).map(([k, t]) => [k, makeScenario(t)]));

// ---- Mission checklist: always visible, so the goal is never a mystery. ----
const MISSION = [
  { label:'Look around: check all 3 places', done:c => c.insp('app:metrics') && c.insp('cache:metrics') && c.insp('db:metrics') },
  { label:'Find the cause',                  done:c => c.insp('cache:logs') && c.insp('app:changes') },
  { label:'Fix it',                          done:c => c.G.status !== 'active' },
];

// ---- Ada: one short sentence per step, then step aside. ----
function mentorSteps(sc) {
  const t = sc.theme;
  return [
    { target:'app',   done:c => c.insp('app:metrics'),
      say:`Tap the ${t.app} 👆 to walk there. Then tap 👀 Check numbers.`, hint:`Start where customers order.` },
    { target:'db',    done:c => c.insp('db:metrics'),
      say:`14 seconds, not 1! Where's the wait? Tap the ${t.db} and check its numbers.`, hint:`Where do orders wait?` },
    { target:'cache', done:c => c.insp('cache:metrics'),
      say:`The ${t.db} is swamped. But who's sending it all that work? Check the ${t.cache}.`, hint:`Something should be blocking most orders.` },
    { target:'cache', done:c => c.insp('cache:logs'),
      say:`The ${t.cache} found 0 out of 100! Why? Tap 📖 Read the diary.`, hint:`Why does it miss every time?` },
    { target:'app',   done:c => c.insp('app:changes'),
      say:`Every tag is brand new. Something changed. Tap the ${t.app}, then ❓ What changed?`, hint:`Did anything change recently?` },
    { target:null,    done:c => c.G.hypothesis !== null || c.G.status !== 'active',
      say:`An update came right before the trouble. Suspect found! Press the 💡 button: "I found the cause".`, hint:`Name your suspect.` },
    { target:null,    done:c => c.G.status !== 'active',
      say:`Pick a fix that removes the cause, not one that hides it.`, hint:`Fix the cause, not the symptom.` },
  ];
}

</script>

<!-- ============================ PURE ENGINE (same as the Debug Dungeon prototype) ============================ -->
<script id="engine">
// ---- The pure engine. No DOM. This is the part worth keeping. ----
const Engine = (() => {
  const inspectedAny = (s, id) => Object.keys(s.inspected).some(k => k.split(':')[0] === id);
  const pace = s => Math.round(s.sc.baseImpact * s.rateMult);
  const reject = (s, text) => ({ ...s, last:{ rejected:true, text } });
  const addLog = (s, tone, text) => [...s.log, { step:s.step, tone, text }];

  // Settle: check the loss conditions after any action that didn't win.
  function settle(s) {
    if (s.status !== 'active') return s;
    if (s.impact >= 100) return { ...s, impact:100, status:'lost', outcome:{ kind:'lost', why:'impact' } };
    if (s.focus <= 0)    return { ...s, status:'lost', outcome:{ kind:'lost', why:'focus' } };
    return s;
  }

  function start(sc) {
    return { sc, step:0, focus:sc.focus, impact:sc.startImpact, rateMult:1, status:'active', outcome:null,
             hypothesis:null, inspected:{}, notebook:[], mitigations:[], fixesTried:[],
             log:[{ step:0, tone:'info', text:'You are paged: ' + sc.symptom }], last:null };
  }

  function reduce(s, a) {
    if (s.status !== 'active') return reject(s, 'The incident is over. Start a new one.');
    const sc = s.sc;

    if (a.type === 'inspect') {
      const tool = TOOLS[a.tool], comp = sc.components[a.target], key = a.target + ':' + a.tool;
      if (!tool || !comp) return reject(s, 'Unknown tool or component.');
      if (s.inspected[key]) return reject(s, 'You already did that. The answer is in your notebook.');
      if (s.focus < tool.cost) return reject(s, `Not enough Focus: that costs ${tool.cost}, you have ${s.focus}.`);
      const dImp = pace(s), step = s.step + 1;
      return settle({ ...s, step, focus:s.focus - tool.cost, impact:s.impact + dImp,
        inspected:{ ...s.inspected, [key]:true },
        notebook:[...s.notebook, { step, target:a.target, tool:a.tool, text:comp.clues[a.tool] }],
        last:{ text:`${tool.label} on ${comp.name}.`, dFocus:-tool.cost, dImpact:dImp } });
    }

    if (a.type === 'hypothesize') {
      const comp = sc.components[a.target];
      if (!comp) return reject(s, 'Unknown component.');
      return { ...s, hypothesis:a.target,
        log:addLog(s, 'info', `Hypothesis: the problem is in ${comp.name}.`),
        last:{ text:`You commit to a hypothesis: ${comp.name}. (Free, but you will be held to it.)`, dFocus:0, dImpact:0 } };
    }

    if (a.type === 'mitigate') {
      const m = sc.mitigations.find(x => x.id === a.id);
      if (!m) return reject(s, 'Unknown mitigation.');
      if (s.mitigations.includes(m.id)) return reject(s, 'Already applied.');
      if (s.focus < m.cost) return reject(s, `Not enough Focus: that costs ${m.cost}, you have ${s.focus}.`);
      const next = { ...s, step:s.step + 1, focus:s.focus - m.cost, rateMult:s.rateMult * m.rateMult, mitigations:[...s.mitigations, m.id] };
      const dImp = pace(next);
      return settle({ ...next, impact:s.impact + dImp,
        log:addLog(next, 'mit', `${m.label}: ${m.note}`),
        last:{ text:`Mitigation applied: ${m.label}.`, dFocus:-m.cost, dImpact:dImp } });
    }

    if (a.type === 'fix') {
      const f = sc.fixes.find(x => x.id === a.id);
      if (!f) return reject(s, 'Unknown fix.');
      const comp = sc.components[f.target];
      if (!inspectedAny(s, f.target)) return reject(s, `You have not even looked at ${comp.name}. Do not change what you have not inspected.`);
      if (s.hypothesis !== f.target) return reject(s, `State your hypothesis first. Say that you believe ${comp.name} is the problem before you touch production.`);
      if (s.fixesTried.includes(f.id)) return reject(s, 'You already tried that.');
      if (s.focus < f.cost) return reject(s, `Not enough Focus: that costs ${f.cost}, you have ${s.focus}.`);
      const step = s.step + 1, focus = s.focus - f.cost;
      if (f.kind === 'root' || f.kind === 'partial') {
        return { ...s, step, focus, status:'won', outcome:{ kind:f.kind, fix:f },
          log:addLog({ ...s, step }, f.kind === 'root' ? 'good' : 'warn', `${f.label}: ${f.outcome}`),
          last:{ text:`Fix applied: ${f.label}.`, dFocus:-f.cost, dImpact:0 } };
      }
      const dImp = pace(s) + f.penalty;
      return settle({ ...s, step, focus, impact:s.impact + dImp, hypothesis:null,
        fixesTried:[...s.fixesTried, f.id],
        log:addLog({ ...s, step }, 'bad', `${f.label}: ${f.outcome} Your hypothesis about ${comp.name} is disproven.`),
        last:{ text:`Fix failed: ${f.label}. Hypothesis cleared.`, dFocus:-f.cost, dImpact:dImp } });
    }
    return reject(s, 'Unknown action.');
  }

  function debrief(s) {
    const examined = [...new Set(Object.keys(s.inspected).map(k => k.split(':')[0]))];
    const o = s.outcome || {};
    let grade, blurb;

// =============== update ===============

const revealCache = () => phase === 'replay' || phase === 'intro' || !!G.inspected['cache:metrics'] || !!G.inspected['cache:logs'];
