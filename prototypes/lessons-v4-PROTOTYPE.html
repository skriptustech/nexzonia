<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<meta name="mobile-web-app-capable" content="yes">
<title>Nexzonia · Debug Lessons</title>

<style>
  :root { --ink:#e8eaf6; --mute:#9aa3c7; --panel:rgba(14,18,38,.9); --line:rgba(140,155,255,.26); --accent:#8b9bff; --ada:#ffb86b; --bad:#ff6b6b; --good:#5fd38d; --warn:#f5b84b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0f24; color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  canvas.hover { cursor:pointer; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px); }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:rgba(139,155,255,.18); color:var(--accent); font-weight:600; }
  .mute { color:var(--mute); } .small { font-size:12px; }
  button { font:inherit; font-size:14px; color:var(--ink); background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left; touch-action:manipulation; }
  button:hover:not(:disabled) { border-color:var(--accent); background:rgba(139,155,255,.16); }
  button:disabled { opacity:.38; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#0b0f24; border-color:var(--accent); font-weight:650; }
  button.primary:hover:not(:disabled) { background:var(--accent); color:#0b0f24; filter:brightness(1.12); }
  kbd { display:inline-block; min-width:18px; text-align:center; font:600 11px system-ui; padding:1px 5px; margin-right:6px; border-radius:5px; background:rgba(255,255,255,.14); }
  .coarse kbd { display:none; }

  /* top bar: mission + patience + notebook */
  #topbar { position:fixed; top:8px; left:8px; right:8px; display:flex; gap:10px; align-items:center; padding:8px 12px; z-index:3; }
  #mission { display:flex; gap:14px; align-items:center; flex:1; min-width:0; }
  .m { display:flex; gap:6px; align-items:center; color:var(--mute); white-space:nowrap; font-size:13px; }
  .m .box { width:18px; height:18px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; flex:none; }
  .m.now { color:var(--ink); font-weight:650; } .m.now .box { border-color:var(--ada); }
  .m.ok { color:var(--ink); } .m.ok .box { background:var(--good); border-color:var(--good); color:#06210f; }
  #pat { display:flex; align-items:center; gap:8px; flex:none; }
  #pat .bar { width:110px; height:8px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; } #pat .bar i { display:block; height:100%; background:var(--good); transition:width .3s,background .3s; }
  #pat .bar.hot i { background:var(--warn); } #pat .bar.crit i { background:var(--bad); }
  #faces { font-size:16px; letter-spacing:1px; white-space:nowrap; }
  #cdxBtn { padding:6px 10px; }

  /* the single guidance bubble */
  #bubble { position:fixed; top:64px; left:8px; width:min(360px,44vw); z-index:3; border-color:rgba(255,184,107,.55); }
  #bubble.shake { animation:shake .6s ease 2; }
  @keyframes shake { 0%,100% { transform:none; } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  #bubble .clue { padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--line); }
  #bubble .clue .src { font-size:12px; color:var(--mute); }
  #bubble .who { display:flex; gap:10px; }
  .av { flex:none; width:30px; height:30px; border-radius:50%; background:var(--ada); color:#2a1a05; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .av.solo { background:#3a4162; color:var(--mute); }
  #bubble b.n { color:var(--ada); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  #bubble.pulse { animation:pulse 1.2s ease-out 1; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(255,184,107,.7); } 100% { box-shadow:0 0 0 14px rgba(255,184,107,0); } }

  /* actions */
  #prompt, #card { bottom:10px; left:50%; transform:translateX(-50%); width:min(780px,calc(100vw - 16px)); z-index:3; }
  #prompt h2, #card h2 { margin:0 0 4px; font-size:15px; }
  .bigrow { display:flex; gap:10px; margin-top:8px; }
  .big { flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 8px; text-align:center; font-size:15px; min-height:84px; }
  .big .ic { font-size:26px; } .big .sub { font-size:12px; }
  .opt { display:block; width:100%; margin:6px 0; padding:12px 14px; font-size:15px; min-height:48px; }
  #fabs { position:fixed; right:10px; bottom:132px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:4; }
  #accuseBtn { padding:12px 16px; font-size:15px; } #accuseBtn.pulse { animation:pulse 1.2s ease-out infinite; }

  #toast { position:fixed; top:112px; left:50%; transform:translateX(-50%); max-width:min(560px,92vw); padding:8px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--accent); opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; z-index:5; }
  #toast.show { opacity:1; } #toast.rej { border-color:var(--bad); color:var(--bad); } #toast.bad { border-color:var(--bad); }
  #wordPop { position:fixed; left:50%; top:112px; transform:translateX(-50%); max-width:min(520px,92vw); padding:10px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--ada); opacity:0; transition:opacity .25s; pointer-events:none; z-index:5; }
  #wordPop.show { opacity:1; }
  #rotate { position:fixed; left:8px; right:8px; top:120px; z-index:6; display:none; text-align:center; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(400px,94vw); background:rgba(10,13,30,.98); border-left:1px solid var(--line); padding:14px; overflow:auto; transform:translateX(100%); transition:transform .2s; z-index:8; }
  #drawer.open { transform:none; } #drawer h3 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  #drawer .e { padding:8px 0; border-bottom:1px solid var(--line); } #drawer .locked { opacity:.35; }
  #overlay { position:fixed; inset:0; display:none; align-items:flex-start; justify-content:center; background:rgba(6,8,20,.86); z-index:10; padding:16px; overflow:auto; }
  #overlay.show { display:flex; } .modal { width:min(700px,100%); margin:auto; background:#10152e; border:1px solid var(--line); border-radius:16px; padding:20px 22px; }
  .modal h1 { margin:0 0 4px; font-size:24px; } .modal h2 { margin:0 0 6px; font-size:22px; } .modal ul { padding-left:20px; margin:6px 0 14px; }
  .scn { display:block; width:100%; margin:8px 0; padding:14px; min-height:56px; } .scn b { display:block; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; } textarea { width:100%; height:120px; background:#0b0f24; color:var(--ink); border:1px solid var(--line); border-radius:8px; font:11px/1.3 monospace; }
  table { border-collapse:collapse; width:100%; font-size:12px; } td, th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }

  /* compact: phones and small landscape screens */
  .compact { font-size:13px; }
  .compact #topbar { top:4px; left:4px; right:4px; padding:5px 8px; gap:8px; }
  .compact .m { font-size:12px; } .compact .m:not(.now) .lbl { display:none; } .compact .m .box { width:16px; height:16px; }
  .compact #pat .mute { display:none; } .compact #pat .bar { width:56px; } .compact #faces { font-size:13px; letter-spacing:0; }
  .compact #bubble { top:48px; left:4px; width:min(250px,40vw); padding:7px 9px; font-size:12px; }
  .compact #bubble .av { width:24px; height:24px; font-size:12px; } .compact #bubble .clue .src { display:none; }
  .compact #prompt, .compact #card { bottom:4px; width:calc(100vw - 8px); padding:6px 8px; }
  .compact #prompt h2 { display:none; } .compact .bigrow { margin-top:0; gap:6px; } .compact .big { min-height:60px; padding:6px 4px; font-size:13px; } .compact .big .ic { font-size:20px; } .compact .big .sub { display:none; }
  .compact #fabs { bottom:78px; right:6px; } .compact #card { max-height:60vh; overflow:auto; }
  .compact #toast { top:48px; font-size:12px; left:auto; right:6px; transform:none; max-width:46vw; }
  .compact #wordPop { top:48px; right:4px; left:auto; bottom:auto; transform:none; width:min(240px,34vw); font-size:11px; padding:6px 8px; }
  .compact .opt { padding:9px 10px; font-size:13px; min-height:42px; margin:4px 0; }
  .portrait #bubble { width:calc(100vw - 8px); top:48px; } .portrait #toast { top:150px; left:50%; right:auto; transform:translateX(-50%); max-width:92vw; } .portrait #wordPop { left:4px; right:auto; top:auto; width:calc(100vw - 8px); bottom:96px; }
  /* visual evidence */
  .vis { margin-top:8px; }
  .vb { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:12px; } .vl { width:88px; color:var(--mute); flex:none; }
  .vt { flex:1; height:10px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; } .vt i { display:block; height:100%; border-radius:99px; } .vt i.good { background:var(--good); } .vt i.bad { background:var(--bad); } .vb b { width:64px; text-align:right; flex:none; }
  .vtags { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .vh { font-size:11px; color:var(--mute); margin-bottom:3px; }
  .tg { display:block; font:600 12px/1.2 ui-monospace,monospace; padding:3px 6px; border-radius:6px; margin:3px 0; } .tg.bad { background:rgba(255,107,107,.16); color:#ffb3b3; } .tg.good { background:rgba(95,211,141,.16); color:#a6f0c0; }
  .vg { width:100%; height:auto; display:block; background:rgba(255,255,255,.04); border-radius:8px; } .vn { font-size:12px; color:var(--mute); margin-top:4px; } .vlines { font:12px/1.5 ui-monospace,monospace; color:#c9d0f5; background:rgba(255,255,255,.05); border-radius:8px; padding:6px 8px; }
  #bubble { max-height:calc(100vh - 190px); overflow:auto; }
  /* evidence board */
  #card { max-height:70vh; overflow:auto; } .board { max-height:30vh; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:4px 8px; }
  .pin { padding:6px 0; border-bottom:1px solid var(--line); } .pin:last-child { border:0; } .pt { font-size:13px; margin-bottom:4px; }
  .pb { display:flex; gap:6px; flex-wrap:wrap; } .pb button { padding:5px 9px; font-size:12px; min-height:34px; } .pb button.on { background:var(--accent); color:#0b0f24; border-color:var(--accent); font-weight:650; }
  .lesson { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; } .lesson > div:first-child { flex:1 1 260px; }
  .bigrow { flex-wrap:wrap; } .big { min-width:84px; }
  .compact .vb { font-size:11px; } .compact .vl { width:64px; } .compact #bubble .vis { margin-top:4px; } .compact .vtags { gap:6px; } .compact .tg { font-size:10px; padding:2px 4px; } .compact .vn { display:none; }
  .accgrid { display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:start; } .portrait .accgrid { grid-template-columns:1fr; }
  .compact #card { max-height:70vh; } .compact .board { max-height:42vh; } .compact .big { min-width:60px; } .compact .opsub { display:none; } .portrait .board { max-height:26vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar" class="panel"><div id="mission"></div><div id="pat"></div><button id="cdxBtn"></button></div>
<div id="bubble" class="panel"></div>
<div id="toast"></div><div id="wordPop"></div>
<div id="rotate" class="panel small">↻ Turn your phone sideways for a bigger view. <button id="rotateX" style="padding:3px 8px;margin-left:6px">OK</button></div>
<div id="prompt" class="panel"></div>
<div id="card" class="panel" style="display:none"></div>
<div id="fabs"><button id="hintBtn">❓ Hint</button><button id="accuseBtn" class="primary">💡 I found the cause</button></div>
<div id="drawer"></div>
<div id="overlay"></div>

<script id="data">
// ---- Tools. A lesson lists which of these it uses; new tools unlock as you learn. ----
const TOOLS = {
  metrics: { label:'Check numbers',  icon:'👀', sub:'How is it doing?',            cost:1 },
  logs:    { label:'Read the diary', icon:'📖', sub:'What has it been doing?',     cost:1 },
  changes: { label:'What changed?',  icon:'❓', sub:'Did anything change lately?', cost:1 },
  trend:   { label:'Graph it',       icon:'📈', sub:'How did it change over time?', cost:1 },
};
const ROLE_LABEL = { cause:'the real cause', symptom:'where the effect shows up', decoy:'a loud decoy', innocent:'an innocent bystander' };

// ---- Words you pick up. Short, with a picture in your head. ----
const CODEX = {
  logs:       { term:'Logs',              pic:'📖', def:'The diary a program keeps about what it did. Engineers read it to find out what happened.' },
  cache:      { term:'Cache',             pic:'🧊', def:'A fast spot that keeps popular answers handy, like the fridge by the counter. It saves a long walk.' },
  symptom:    { term:'Symptom vs. cause', pic:'🔥', def:'The busy storeroom is a symptom, the thing you can see. The cause is what made it busy. Fix the cause.' },
  deploy:     { term:'Update (deploy)',   pic:'🚀', def:'Putting new code live. Lots of problems start right after one, so always ask "what changed?"' },
  hypothesis: { term:'Hypothesis',        pic:'💡', def:'A guess you state before you act, so you can check if you were right.' },
  rollback:   { term:'Rollback',          pic:'⏪', def:'Undoing an update by going back to the old version. Often the fastest safe fix.' },
  ruleout:    { term:'Ruling out',        pic:'✂️', def:'Checking suspects that turn out fine, so you can stop worrying about them. Not wasted effort: it narrows the search.' },
  trend:      { term:'Trend',             pic:'📈', def:'A graph shows how something changes over time. One number is a snapshot. A graph tells the story.' },
  leak:       { term:'Memory leak',       pic:'🪣', def:'A program keeps saving things and never cleans up, so it slowly clogs and slows down. On a graph it looks like a sawtooth.' },
  mitigation: { term:'Mitigation',        pic:'🩹', def:'A quick move that eases the pain without fixing the cause, like restarting. It buys time. It is not the fix.' },
};

const THEMES = {
  canteen: {
    id:'canteen', place:'school tuckshop', app:'Counter', cache:'Fridge', db:'Storeroom',
    appNoun:'counter', cacheNoun:'fridge', dbNoun:'storeroom', thing:'order', item:'snack', have:['roti', 'samosa', 'juice'],
    welcome:'Welcome to the school tuckshop. Students order roti, samosas and juice at the counter.',
    sub:{ app:'takes the orders', cache:'popular snacks, super quick', db:'has everything, but far away' },
    blurb:{ app:'Students order here.', cache:'Keeps the popular snacks close.', db:'Holds everything, but it\'s a long walk.' },
    customers:[
      { name:'Mere',  story:'Her lunch break ran out.' }, { name:'Jone',  story:'He had rugby practice.' },
      { name:'Seini', story:'She had a test next period.' }, { name:'Anil',  story:'He skipped breakfast.' }, { name:'Priya', story:'She was starving.' } ],
  },
  tuckshop2: {
    id:'tuckshop2', place:'school tuckshop', app:'Counter', cache:'Fridge', db:'Storeroom',
    appNoun:'counter', cacheNoun:'fridge', dbNoun:'storeroom', thing:'order', item:'snack', have:['roti', 'samosa', 'juice'],
    welcome:'It\'s a new day at the tuckshop. In the morning, the counter is fast.',
    sub:{ app:'takes the orders', cache:'popular snacks, super quick', db:'has everything, but far away' },
    blurb:{ app:'Students order here.', cache:'Keeps the popular snacks close.', db:'Holds everything, but it\'s a long walk.' },
    customers:[
      { name:'Ana',    story:'She had netball training.' }, { name:'Vikash', story:'His bus was leaving.' },
      { name:'Losana', story:'She needed lunch before class.' }, { name:'Tomasi', story:'He was meeting his cousins.' }, { name:'Salote', story:'It was her birthday treat.' } ],
  },
  ticket_rush: {
    id:'ticket_rush', place:'ticket site', app:'Box Office', cache:'Seat Board', db:'Archive',
    appNoun:'box office', cacheNoun:'seat board', dbNoun:'archive', thing:'ticket request', item:'seat', have:['seat-A12', 'seat-A13', 'seat-C07'],
    welcome:'Welcome to the ticket site. The box office takes requests for Fiji Sevens seats.',
    sub:{ app:'takes the requests', cache:'recent seats, super quick', db:'every seat ever, far away' },
    blurb:{ app:'Ticket requests arrive here.', cache:'Lists seats that were just checked.', db:'Every seat ever sold. Big and slow.' },
    customers:[
      { name:'Sera', story:'She wanted tickets for her dad.' }, { name:'Tomasi', story:'He had saved for months.' },
      { name:'Losana', story:'Her friends were waiting on her.' }, { name:'Raj', story:'He was buying for his whole class.' }, { name:'Ana', story:'It was the final day.' } ],
  },
};

// ---------- visual evidence: show the answer, don't just say it ----------
const sawtooth = () => { const s = []; for (let i = 0; i < 48; i++) { if (i < 8) { s.push(12 + (i % 2)); continue; } const d = (i - 8) % 13; s.push(10 + d * 6.5); } return s; };
const flat = v => Array.from({ length:48 }, (_, i) => v + ((i * 7) % 3));
const bars = (rows, max) => ({ type:'bars', rows, max });

// ======================= Lesson 1 + disguise: the Empty Fridge =======================
function makeCacheScenario(t, o) {
  const tag = o.tag;
  return {
    id:t.id, sim:'cache', title:o.title, symptom:o.symptom, theme:t, tools:['metrics', 'logs', 'changes'],
    focus:99, startImpact:5, baseImpact:4,
    lock:{ changes:['cache:logs'] },
    accuseNeeds:['cache:logs', 'app:changes'],
    codexOn:{ 'cache:metrics':['cache'], 'cache:logs':['logs', 'symptom'], 'app:changes':['deploy'] },
    mission:[
      { label:'Look around', done:c => c.insp('app:metrics') && c.insp('cache:metrics') && c.insp('db:metrics') },
      { label:'Find the cause', done:c => c.insp('cache:logs') && c.insp('app:changes') },
      { label:'Fix it', done:c => c.G.status !== 'active' } ],
    hints:['Check all three places.', 'Read the diary of the one that found nothing. Then ask what changed.', 'Pick the cause, not the symptom.'],
    components:{
      app:{ name:t.app, role:'cause', calls:['cache', 'db'], clues:{
        metrics:`Each ${t.thing} takes 14 seconds. It should take 1.`,
        logs:`"${t.cache}: nothing. ${t.db}: waited 13 seconds." Again and again.`,
        changes:`Update #${o.rel}, ${o.ago + 1} minutes ago: "${o.relName}". The slowdown began ${o.ago} minutes ago.` } },
      cache:{ name:t.cache, role:'symptom', calls:[], clues:{
        metrics:`The ${t.cacheNoun} works fine, but it found 0 ${t.item}s out of 100. Normally 94.`,
        logs:`Orders ask for ${tag} like "${o.keys[0]}" and "${o.keys[1]}". The ${t.cacheNoun} has never seen them.`,
        changes:`Nobody touched the ${t.cacheNoun} in 30 days.` } },
      db:{ name:t.db, role:'decoy', calls:[], clues:{
        metrics:`The ${t.dbNoun} is 98% busy. Look at that line!`,
        logs:`Just ordinary requests, but 40 times more than usual.`,
        changes:`No changes for 3 weeks.` } } },
    short:{ app:{ metrics:'14 sec per order', logs:`${t.cacheNoun} empty → ${t.dbNoun} wait`, changes:`update #${o.rel} · ${o.ago + 1} min ago` },
            cache:{ metrics:'0 of 100 found', logs:'tags never seen before', changes:'untouched 30 days' },
            db:{ metrics:'98% busy', logs:'40× normal requests', changes:'no changes' } },
    visual:{
      'app:metrics':bars([{ label:'Normal', v:1, text:'1 sec', c:'good' }, { label:'Now', v:14, text:'14 sec', c:'bad' }], 14),
      'cache:metrics':bars([{ label:'Normal', v:94, text:'94 / 100', c:'good' }, { label:'Now', v:0, text:'0 / 100', c:'bad' }], 100),
      'db:metrics':bars([{ label:'Normal', v:20, text:'20% busy', c:'good' }, { label:'Now', v:98, text:'98% busy', c:'bad' }], 100),
      'db:logs':bars([{ label:'Normal', v:1, text:'1×', c:'good' }, { label:'Now', v:40, text:'40×', c:'bad' }], 40),
      'app:logs':{ type:'lines', lines:[`${t.cache}: nothing ✗`, `${t.db}: waited 13 sec 🐌`, `${t.cache}: nothing ✗`, `${t.db}: waited 13 sec 🐌`] },
      'cache:logs':{ type:'tags', askTitle:'Orders ask for', haveTitle:`${t.cache} has`, ask:o.keys, have:t.have, note:'No match. Every tag ends in a new time, so the fridge can never find one.' } },
    mitigations:[],
    fixes:[
      { id:'f_rollback', target:'app', label:`Undo update #${o.rel} (rollback)`, cost:1, kind:'root',
        outcome:`The old ${tag} are back. The ${t.cacheNoun} finds ${t.item}s again and the line melts away.` },
      { id:'f_staff', target:'app', label:`Hire more ${t.appNoun} staff`, cost:1, kind:'wrong', penalty:12,
        outcome:`More staff, same problem. They all still walk to the empty ${t.cacheNoun} and the busy ${t.dbNoun}.` },
      { id:'f_restock', target:'cache', label:`Refill the ${t.cacheNoun}`, cost:1, kind:'wrong', penalty:12,
        outcome:`The refilled items have the old ${tag}. New orders use new ${tag}, so still nothing matches.` },
      { id:'f_clerks', target:'db', label:`Add more ${t.dbNoun} helpers`, cost:1, kind:'partial', world:{ broken:true, clerks:true },
        outcome:`The line moves faster, but the ${t.dbNoun} still does 40 times the work. Time bought, cause not fixed.` } ],
    rootSummary:`Update #${o.rel} changed how the ${t.appNoun} writes ${tag}, so the ${t.cacheNoun} never recognised an ${t.thing}. Everything went to the ${t.dbNoun}, a huge line formed, and people gave up.`,
    lessons:[`The busy ${t.dbNoun} was a symptom. The cause was further back.`, `"What changed?" found the culprit fast.`, `Fix the cause (undo the update), not just the symptom.`],
    intro:t.id === 'canteen' ? [
      { focus:'app',   tap:'app',   text:'Let\'s learn the tuckshop. Tap the Counter to walk there.', ok:'The counter is where every order arrives.', world:{ hit:.7 } },
      { focus:'cache', tap:'cache', text:'Now tap the Fridge.', ok:'The fridge keeps the popular snacks, so grabbing one is quick ✓', world:{ hit:.7 } },

<script id="engine">
// ---- The pure engine. No DOM. This is the part worth keeping. ----
const Engine = (() => {
  const inspectedAny = (s, id) => Object.keys(s.inspected).some(k => k.split(':')[0] === id);
  const pace = s => Math.round(s.sc.baseImpact * s.rateMult);
  const reject = (s, text) => ({ ...s, last:{ rejected:true, text } });
  const addLog = (s, tone, text) => [...s.log, { step:s.step, tone, text }];

  // Settle: check the loss conditions after any action that didn't win.
  function settle(s) {
    if (s.status !== 'active') return s;
    if (s.impact >= 100) return { ...s, impact:100, status:'lost', outcome:{ kind:'lost', why:'impact' } };
    if (s.focus <= 0)    return { ...s, status:'lost', outcome:{ kind:'lost', why:'focus' } };
    return s;
  }

  function start(sc) {
    return { sc, step:0, focus:sc.focus, impact:sc.startImpact, rateMult:1, status:'active', outcome:null,
             hypothesis:null, inspected:{}, notebook:[], mitigations:[], fixesTried:[],
             log:[{ step:0, tone:'info', text:'You are paged: ' + sc.symptom }], last:null };
  }

  function reduce(s, a) {
    if (s.status !== 'active') return reject(s, 'The incident is over. Start a new one.');
    const sc = s.sc;

    if (a.type === 'inspect') {
      const tool = TOOLS[a.tool], comp = sc.components[a.target], key = a.target + ':' + a.tool;
      if (!tool || !comp) return reject(s, 'Unknown tool or component.');
      if (s.inspected[key]) return reject(s, 'You already did that. The answer is in your notebook.');
      if (s.focus < tool.cost) return reject(s, `Not enough Focus: that costs ${tool.cost}, you have ${s.focus}.`);
      const dImp = pace(s), step = s.step + 1;
      return settle({ ...s, step, focus:s.focus - tool.cost, impact:s.impact + dImp,
        inspected:{ ...s.inspected, [key]:true },
        notebook:[...s.notebook, { step, target:a.target, tool:a.tool, text:comp.clues[a.tool] }],
        last:{ text:`${tool.label} on ${comp.name}.`, dFocus:-tool.cost, dImpact:dImp } });
    }

    if (a.type === 'hypothesize') {
      const comp = sc.components[a.target];
      if (!comp) return reject(s, 'Unknown component.');
      return { ...s, hypothesis:a.target,
        log:addLog(s, 'info', `Hypothesis: the problem is in ${comp.name}.`),
        last:{ text:`You commit to a hypothesis: ${comp.name}. (Free, but you will be held to it.)`, dFocus:0, dImpact:0 } };
    }

    if (a.type === 'mitigate') {
      const m = sc.mitigations.find(x => x.id === a.id);
      if (!m) return reject(s, 'Unknown mitigation.');
      if (s.mitigations.includes(m.id)) return reject(s, 'Already applied.');
      if (s.focus < m.cost) return reject(s, `Not enough Focus: that costs ${m.cost}, you have ${s.focus}.`);
      const next = { ...s, step:s.step + 1, focus:s.focus - m.cost, rateMult:s.rateMult * m.rateMult, mitigations:[...s.mitigations, m.id] };
      const dImp = pace(next);
      return settle({ ...next, impact:s.impact + dImp,
        log:addLog(next, 'mit', `${m.label}: ${m.note}`),
        last:{ text:`Mitigation applied: ${m.label}.`, dFocus:-m.cost, dImpact:dImp } });
    }

    if (a.type === 'fix') {
      const f = sc.fixes.find(x => x.id === a.id);
      if (!f) return reject(s, 'Unknown fix.');
      const comp = sc.components[f.target];
      if (!inspectedAny(s, f.target)) return reject(s, `You have not even looked at ${comp.name}. Do not change what you have not inspected.`);
      if (s.hypothesis !== f.target) return reject(s, `State your hypothesis first. Say that you believe ${comp.name} is the problem before you touch production.`);
      if (s.fixesTried.includes(f.id)) return reject(s, 'You already tried that.');
      if (s.focus < f.cost) return reject(s, `Not enough Focus: that costs ${f.cost}, you have ${s.focus}.`);
      const step = s.step + 1, focus = s.focus - f.cost;
      if (f.kind === 'root' || f.kind === 'partial') {
        return { ...s, step, focus, status:'won', outcome:{ kind:f.kind, fix:f },
          log:addLog({ ...s, step }, f.kind === 'root' ? 'good' : 'warn', `${f.label}: ${f.outcome}`),
          last:{ text:`Fix applied: ${f.label}.`, dFocus:-f.cost, dImpact:0 } };
      }
      const dImp = pace(s) + f.penalty;
      return settle({ ...s, step, focus, impact:s.impact + dImp, hypothesis:null,
        fixesTried:[...s.fixesTried, f.id],
        log:addLog({ ...s, step }, 'bad', `${f.label}: ${f.outcome} Your hypothesis about ${comp.name} is disproven.`),
        last:{ text:`Fix failed: ${f.label}. Hypothesis cleared.`, dFocus:-f.cost, dImpact:dImp } });
    }
    return reject(s, 'Unknown action.');
  }

  function debrief(s) {
    const examined = [...new Set(Object.keys(s.inspected).map(k => k.split(':')[0]))];
    const o = s.outcome || {};
    let grade, blurb;
    if (o.kind === 'root') {
      grade = (s.impact < 60 && s.fixesTried.length === 0) ? 'Clean resolution' : 'Resolved, with scars';
      blurb = 'You found and fixed the root cause.';
    } else if (o.kind === 'partial') {
      grade = 'Patched, not fixed';
      blurb = 'The pages stopped, but the underlying bug is still there.';
    } else if (o.why === 'impact') {
      grade = 'Customers walked away'; blurb = 'Impact hit 100 before you found the cause.';
    } else {
      grade = 'Out of steam. Time to escalate'; blurb = 'You ran out of Focus before resolving the incident.';
    }
    return { grade, blurb, examined, wrongFixes:s.fixesTried.length, mitigations:s.mitigations.length };
  }

  return { start, reduce, debrief, inspectedAny };
})();
